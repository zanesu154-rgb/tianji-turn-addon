<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>栈主的附加包汉化工具</title>
    <link rel="stylesheet" href="style.css?v=2026.11.11-21">
</head>
<body>
    <!-- 顶栏：标题 · 访问计数 · 界面语言 -->
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <span class="brand-logo">🌏</span>
                <span class="brand-name" data-i18n="title">栈主的附加包汉化工具</span>
            </div>
            <div class="topbar-right">
                <label class="lang-switch" data-i18n-title="ui_lang" title="界面语言">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                    <select id="ui-lang"></select>
                </label>
            </div>
        </div>
    </header>

    <!-- 访问计数：LED 数码管样式（数字来自不蒜子，加载成功才显示） -->
    <div id="visit-counter" class="led-board" hidden>
        <div class="led-panel">
            <div class="led-group">
                <span class="led-label" data-i18n="visits">访问</span>
                <span class="led-digits" id="led-pv"></span>
            </div>
            <span class="led-colon"><i></i><i></i></span>
            <div class="led-group">
                <span class="led-label" data-i18n="visitors">访客</span>
                <span class="led-digits" id="led-uv"></span>
            </div>
        </div>
        <span id="busuanzi_value_page_pv" hidden></span>
        <span id="busuanzi_value_site_uv" hidden></span>
    </div>

    <div class="container">
        <p class="subtitle" data-i18n="subtitle">提取 Minecraft 基岩版附加包、存档中玩家可见的文本，生成可多语种翻译的 lang 文件</p>

        <div class="layout">
            <!-- 左栏：模式、上传、选项 -->
            <div class="col col-input">
                <nav class="mode-tabs" role="tablist">
                    <button class="mode-tab active" data-mode="addon" role="tab" data-i18n="mode_addon">附加包</button>
                    <button class="mode-tab" data-mode="world" role="tab" data-i18n="mode_world">世界存档</button>
                </nav>
                <p id="mode-hint" class="mode-hint"></p>

                <div id="drop-zone" class="drop-zone">
                    <div class="drop-icon">
                        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                    </div>
                    <p class="drop-title" id="drop-title"></p>
                    <p class="drop-hint" data-i18n="drop_hint">或拖拽文件到此处</p>
                    <input type="file" id="file-input" accept=".mcaddon,.mcpack,.zip,.mcworld,.mctemplate,.mcstructure" hidden>
                </div>

                <details class="options-section" open>
                    <summary data-i18n="options">处理选项</summary>
                    <div class="options-grid">
                        <label class="opt-field">
                            <span data-i18n="opt_source">原文语言</span>
                            <select id="opt-source">
                                <option value="auto" selected data-i18n="opt_auto">自动识别</option>
                                <option value="zh_CN">简体中文 zh_CN</option>
                                <option value="en_US">English en_US</option>
                                <option value="zh_TW">繁體中文 zh_TW</option>
                                <option value="ja_JP">日本語 ja_JP</option>
                                <option value="ko_KR">한국어 ko_KR</option>
                                <option value="ru_RU">Русский ru_RU</option>
                            </select>
                        </label>
                        <label class="opt-field">
                            <span data-i18n="opt_targets">生成语言文件（逗号分隔）</span>
                            <input id="opt-targets" type="text" value="en_US, zh_CN" spellcheck="false">
                        </label>
                        <label class="opt-field opt-wide">
                            <span data-i18n="opt_say">say / tell / me 命令</span>
                            <select id="opt-say">
                                <option value="tellraw" selected data-i18n="say_tellraw">转为 tellraw</option>
                                <option value="titleraw" data-i18n="say_titleraw">转为 titleraw</option>
                                <option value="actionbar" data-i18n="say_actionbar">转为 titleraw（物品栏上方）</option>
                                <option value="keep" data-i18n="say_keep">不转换</option>
                            </select>
                        </label>
                        <label class="opt-field opt-wide addon-only">
                            <span data-i18n="opt_langfields">脚本自带翻译字段</span>
                            <input id="opt-langfields" type="text" value="" data-i18n-ph="opt_langfields_ph" spellcheck="false">
                        </label>
                        <label class="opt-check addon-only"><input id="opt-scripts" type="checkbox" checked> <span data-i18n="opt_scripts">处理脚本</span></label>
                        <label class="opt-check addon-only"><input id="opt-runtime" type="checkbox" checked> <span data-i18n="opt_runtime">注入运行时翻译</span></label>
                        <label class="opt-check addon-only"><input id="opt-fill" type="checkbox" checked> <span data-i18n="opt_fill">从其他语言补全缺失键</span></label>
                        <label class="opt-check addon-only"><input id="opt-placeholder" type="checkbox" checked> <span data-i18n="opt_placeholder">生成占位名</span></label>
                        <label class="opt-check"><input id="opt-cbname" type="checkbox"> <span data-i18n="opt_cbname">列出命令方块名称</span></label>
                        <label class="opt-check"><input id="opt-hidden" type="checkbox"> <span data-i18n="opt_hidden">提取创造物品栏里不显示的物品</span></label>
                        <label class="opt-check"><input id="opt-junk" type="checkbox" checked> <span data-i18n="opt_junk">删除模板残留的无效语言条目</span></label>
                        <!-- 只在简体中文界面显示：名字标签等只认纯文字的位置，固定写入简体中文 -->
                        <div id="bake-wrap" class="opt-bake" hidden>
                            <label class="opt-check"><input id="opt-bake" type="checkbox"> <span>掉落物名字、名字标签等只认纯文字的位置，固定写入简体中文（所有玩家都显示中文）</span></label>
                            <label class="opt-bake-file">可选：上传翻译好的 zh_CN.lang <input id="opt-bake-file" type="file" accept=".lang,.txt"></label>
                            <small id="opt-bake-info">不上传时用包自带的中文、脚本里的中文和游戏自带的物品名</small>
                        </div>
                        <label class="opt-check"><input id="opt-split" type="checkbox"> <span data-i18n="opt_split">多行文本拆成多个键</span></label>
                    </div>
                </details>
            </div>

            <!-- 右栏：进度、结果、下载、日志 -->
            <div class="col col-output">
                <div class="output-section">
                    <div class="output-header">
                        <span class="output-label" data-i18n="progress">转换进度</span>
                        <span id="progress-text" class="output-status"></span>
                    </div>
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                </div>

                <div id="summary" class="summary-section" hidden></div>

                <div class="download-section">
                    <button id="download-result" class="btn btn-primary" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        <span data-i18n="dl_result">下载转换后文件</span>
                    </button>
                    <button id="download-workbook" class="btn btn-secondary" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <line x1="3" y1="9" x2="21" y2="9"/>
                            <line x1="9" y1="21" x2="9" y2="9"/>
                        </svg>
                        <span data-i18n="dl_workbook">下载翻译表</span>
                    </button>
                    <button id="download-log" class="btn btn-secondary" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                        <span data-i18n="dl_log">下载日志</span>
                    </button>
                </div>

                <div class="log-section">
                    <div class="log-header">
                        <span class="log-label"><span data-i18n="log">处理日志</span> <small class="log-note" data-i18n="log_note"></small></span>
                        <button id="toggle-log" class="toggle-btn" data-i18n="expand">展开</button>
                    </div>
                    <div id="log" class="log collapsed"></div>
                </div>
            </div>
        </div>

        <!-- 编辑器（需人工翻译 / NBT），占满宽度 -->
        <section id="nbt-editor" class="nbt-editor" hidden></section>

        <footer class="footer">
            <p><span id="footer-by"></span> · <span data-i18n="footer_local">纯前端处理，文件不上传</span> · <span id="app-version">v2026.11.11-18</span></p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/json5@2.2.3/dist/index.min.js"></script>
    <script src="src/ui-i18n.js?v=2026.11.11-21"></script>
    <script src="vendor/acorn.js?v=2026.11.11-21"></script>
    <script src="src/util.js?v=2026.11.11-21"></script>
    <script src="src/lang-blacklist.js?v=2026.11.11-21"></script>
    <script src="src/minversion.js?v=2026.11.11-21"></script>
    <script src="src/vanilla-names.js?v=2026.11.11-21"></script>
    <script src="src/context.js?v=2026.11.11-21"></script>
    <script src="src/commands.js?v=2026.11.11-21"></script>
    <script src="src/json.js?v=2026.11.11-21"></script>
    <script src="src/script.js?v=2026.11.11-21"></script>
    <script src="src/pipeline.js?v=2026.11.11-21"></script>
    <script src="src/world/nbt.js?v=2026.11.11-21"></script>
    <script src="src/world/leveldb.js?v=2026.11.11-21"></script>
    <script src="src/world/world.js?v=2026.11.11-21"></script>
    <script src="src/world/editor.js?v=2026.11.11-21"></script>
    <script src="app.js?v=2026.11.11-21"></script>
    <!-- 访问计数（不蒜子，第三方服务；加载失败时不显示） -->
    <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
