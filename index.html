<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>栈主的附加包汉化工具</title>
    <link rel="stylesheet" href="style.css?v=2026.11.07-17">
</head>
<body>
    <div class="container">
        <!-- 标题 -->
        <header class="header">
            <div class="logo">🌏</div>
            <h1>栈主的附加包汉化工具</h1>
            <p class="subtitle">提取 Minecraft 基岩版附加包中玩家可见的文本，生成可多语种翻译的 lang 文件</p>
        </header>

        <!-- 模式切换 -->
        <nav class="mode-tabs" role="tablist">
            <button class="mode-tab active" data-mode="addon" role="tab">附加包</button>
            <button class="mode-tab" data-mode="world" role="tab">世界存档</button>
        </nav>
        <p id="mode-hint" class="mode-hint">处理 .mcaddon / .mcpack：物品、方块、实体、对话、UI、脚本等文本</p>

        <!-- 上传区 -->
        <div id="drop-zone" class="drop-zone">
            <div class="drop-icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
            </div>
            <p class="drop-title" id="drop-title">点击上传 .mcaddon / .mcpack / .zip</p>
            <p class="drop-hint">或拖拽文件到此处</p>
            <input type="file" id="file-input" accept=".mcaddon,.mcpack,.zip,.mcworld,.mctemplate,.mcstructure" hidden>
        </div>

        <!-- 选项 -->
        <details class="options-section" open>
            <summary>处理选项</summary>
            <div class="options-grid">
                <label class="opt-field">
                    <span>原文语言</span>
                    <select id="opt-source">
                        <option value="auto" selected>自动识别</option>
                        <option value="zh_CN">简体中文 zh_CN</option>
                        <option value="en_US">English en_US</option>
                        <option value="zh_TW">繁體中文 zh_TW</option>
                        <option value="ja_JP">日本語 ja_JP</option>
                        <option value="ko_KR">한국어 ko_KR</option>
                        <option value="ru_RU">Русский ru_RU</option>
                    </select>
                </label>
                <label class="opt-field">
                    <span>生成语言文件（逗号分隔）</span>
                    <input id="opt-targets" type="text" value="en_US, zh_CN" spellcheck="false">
                </label>
                <label class="opt-field opt-wide addon-only">
                    <span>脚本自带翻译字段（留空自动识别；off 关闭；手动：s=en_US, v=vi_VN；按文件：dialogue_es.js:v=es_ES）</span>
                    <input id="opt-langfields" type="text" value="" placeholder="自动识别" spellcheck="false">
                </label>
                <label class="opt-check addon-only"><input id="opt-scripts" type="checkbox" checked> 处理脚本（scripts/*.js）</label>
                <label class="opt-check addon-only"><input id="opt-runtime" type="checkbox" checked> 注入运行时翻译（变量、对象表等动态文本）</label>
                <label class="opt-field">
                    <span>say / tell 命令</span>
                    <select id="opt-say">
                        <option value="tellraw" selected>转为 tellraw（聊天栏，保留 [发送者] 前缀）</option>
                        <option value="titleraw">转为 titleraw（屏幕中央标题）</option>
                        <option value="actionbar">转为 titleraw（物品栏上方）</option>
                        <option value="keep">不转换（只列入报告）</option>
                    </select>
                </label>
                <label class="opt-check"><input id="opt-split" type="checkbox"> 多行文本拆成多个键（默认一段一个键，换行写作 \n）</label>
                <label class="opt-check addon-only"><input id="opt-fill" type="checkbox" checked> 从其他语言补全缺失键</label>
                <label class="opt-check addon-only"><input id="opt-placeholder" type="checkbox" checked> 为没有名称的物品/方块/实体生成占位名</label>
            </div>
        </details>

        <!-- 输出区 -->
        <div class="output-section">
            <div class="output-header">
                <span class="output-label">转换进度</span>
                <span id="progress-text" class="output-status">等待中...</span>
            </div>
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
        </div>

        <!-- 结果摘要 -->
        <div id="summary" class="summary-section" hidden></div>

        <!-- 存档 NBT 编辑器 -->
        <section id="nbt-editor" class="nbt-editor" hidden></section>

        <!-- 下载按钮 -->
        <div class="download-section">
            <button id="download-log" class="btn btn-secondary" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                </svg>
                下载日志
            </button>
            <button id="download-workbook" class="btn btn-secondary" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <line x1="3" y1="9" x2="21" y2="9"/>
                    <line x1="9" y1="21" x2="9" y2="9"/>
                </svg>
                下载翻译表
            </button>
            <button id="download-result" class="btn btn-primary" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                下载转换后文件
            </button>
        </div>

        <!-- 日志 -->
        <div class="log-section">
            <div class="log-header">
                <span class="log-label">处理日志</span>
                <button id="toggle-log" class="toggle-btn">展开</button>
            </div>
            <div id="log" class="log collapsed"></div>
        </div>

        <!-- 页脚 -->
        <footer class="footer">
            <p>由 <a href="https://github.com/zanesu154-rgb" target="_blank">栈主</a> 制作 · 纯前端处理，文件不上传 · <span id="app-version">v2026.11.07-17</span></p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/json5@2.2.3/dist/index.min.js"></script>
    <script src="vendor/acorn.js?v=2026.11.07-17"></script>
    <script src="src/util.js?v=2026.11.07-17"></script>
    <script src="src/context.js?v=2026.11.07-17"></script>
    <script src="src/commands.js?v=2026.11.07-17"></script>
    <script src="src/json.js?v=2026.11.07-17"></script>
    <script src="src/script.js?v=2026.11.07-17"></script>
    <script src="src/pipeline.js?v=2026.11.07-17"></script>
    <script src="src/world/nbt.js?v=2026.11.07-17"></script>
    <script src="src/world/leveldb.js?v=2026.11.07-17"></script>
    <script src="src/world/world.js?v=2026.11.07-17"></script>
    <script src="src/world/editor.js?v=2026.11.07-17"></script>
    <script src="app.js?v=2026.11.07-17"></script>
</body>
</html>
