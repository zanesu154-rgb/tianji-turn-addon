name: Claude Code

on:
  # Issue 和 PR 对话区评论
  issue_comment:
    types: [created]

  # PR 行内代码审查评论
  pull_request_review_comment:
    types: [created]

  # Issue 创建或分配
  issues:
    types: [opened, assigned]

  # PR 正式 Review
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') ||
         contains(github.event.issue.title, '@claude')))

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Resolve sample-<NAME> label, download and validate the real sample before Claude starts.
      # The private-repository token is scoped to this step only.
      - name: Resolve and validate real sample
        id: sample
        env:
          GH_TOKEN: ${{ secrets.SAMPLE_REPO_TOKEN }}
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels) }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t sample_labels < <(
            jq -rn --argjson il "${ISSUE_LABELS:-null}" --argjson pl "${PR_LABELS:-null}" '
              (($il // $pl // []) | map(.name | select(startswith("sample-"))) | unique)[]
            '
          )

          if [[ "${#sample_labels[@]}" -eq 0 ]]; then
            echo "No sample-* label present; skipping sample download."
            echo "label=" >> "$GITHUB_OUTPUT"
            echo "archive=" >> "$GITHUB_OUTPUT"
            echo "sha256=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${#sample_labels[@]}" -gt 1 ]]; then
            echo "::error::Multiple sample labels found (${sample_labels[*]}). Expected at most one sample-<NAME> label."
            exit 1
          fi

          selected_label="${sample_labels[0]}"

          case "$selected_label" in
            sample-JJK)
              release_tag="JJK"
              asset_pattern="*.mcaddon"
              archive_filename="JJK.mcaddon"
              ;;
            *)
              echo "::error::Unknown or unconfigured sample label '$selected_label'. Add its mapping in .github/workflows/claude.yml and CLAUDE.md first."
              exit 1
              ;;
          esac

          sample_dir="$GITHUB_WORKSPACE/.tmp-sample"
          mkdir -p "$sample_dir"
          grep -qxF '.tmp-sample/' .git/info/exclude || echo '.tmp-sample/' >> .git/info/exclude

          gh release download "$release_tag" \
            --repo zanesu154-rgb/BUG-Test-addon-world \
            --pattern "$asset_pattern" \
            --dir "$sample_dir"

          mapfile -t assets < <(find "$sample_dir" -maxdepth 1 -type f -iname "$asset_pattern" -print)
          if [[ "${#assets[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one $asset_pattern asset in Release $release_tag; found ${#assets[@]}."
            exit 1
          fi

          sample_archive="$sample_dir/$archive_filename"
          if [[ "${assets[0]}" != "$sample_archive" ]]; then
            cp -- "${assets[0]}" "$sample_archive"
          fi

          if [[ ! -s "$sample_archive" ]]; then
            echo "::error::Downloaded archive is missing or empty."
            exit 1
          fi

          if ! unzip -tq "$sample_archive" >/dev/null; then
            echo "::error::The downloaded archive is not a valid readable ZIP/MCADDON package."
            exit 1
          fi

          sample_sha256="$(sha256sum "$sample_archive" | awk '{print $1}')"
          echo "label=$selected_label" >> "$GITHUB_OUTPUT"
          echo "archive=$sample_archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$sample_sha256" >> "$GITHUB_OUTPUT"

          {
            echo "### Staged Real Sample"
            echo "- **Label**: \`$selected_label\`"
            echo "- **Release Tag**: \`$release_tag\`"
            echo "- **Archive**: \`$sample_archive\`"
            echo "- **SHA-256**: \`$sample_sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.AIHUBMIX_API_KEY }}

          # 支持 /opus 切换模型、命令行白名单、样包元数据注入以及最大 30 轮熔断限制
          claude_args: >-
            ${{ contains(format('{0} {1} {2}',
            github.event.comment.body,
            github.event.issue.body,
            github.event.review.body),
            '/opus')
            && '--model claude-opus-5-5'
            || '--model claude-sonnet-5-5' }}
            --allowedTools "Bash(node:*),Bash(git:*),Bash(gh:*),Bash(unzip:*),Bash(mkdir:*),Bash(grep:*),Bash(diff:*),Bash(ls:*),Bash(sha256sum:*),Bash(printenv:*)"
            ${{ steps.sample.outputs.archive != '' && format('--append-system-prompt "Staged real sample metadata: SAMPLE_LABEL={0}, SAMPLE_ARCHIVE={1}, SAMPLE_SHA256={2}"', steps.sample.outputs.label, steps.sample.outputs.archive, steps.sample.outputs.sha256) || '' }}
            --max-turns 30

          # 允许 Claude 读取 GitHub Actions CI 结果
          additional_permissions: |
            actions: read

        env:
          ANTHROPIC_BASE_URL: https://aihubmix.com
          SAMPLE_LABEL: ${{ steps.sample.outputs.label }}
          SAMPLE_ARCHIVE: ${{ steps.sample.outputs.archive }}
          SAMPLE_SHA256: ${{ steps.sample.outputs.sha256 }}
