name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.AIHUBMIX_API_KEY }}
          claude_args: ${{ contains(format('{0} {1}', github.event.comment.body, github.event.issue.body), '/opus') && '--model claude-opus-5-5' || '--model claude-sonnet-5-5' }}
        env:
          ANTHROPIC_BASE_URL: https://aihubmix.com
          SAMPLE_REPO_TOKEN: ${{ secrets.SAMPLE_REPO_TOKEN }}
