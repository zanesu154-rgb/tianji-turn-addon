name: Claude Code

on:
  # Issue 和 PR 对话区评论
  issue_comment:
    types: [created]

  # PR 行内代码审查评论
  pull_request_review_comment:
    types: [created]

  # Issue 创建或分配
  issues:
    types: [opened, assigned]

  # PR 正式 Review
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') ||
         contains(github.event.issue.title, '@claude')))

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.AIHUBMIX_API_KEY }}

          # 支持 /opus 切换模型，并放行测试、基线对比与跨仓库拉取样包所需的终端命令
          claude_args: >-
            ${{ contains(format('{0} {1} {2}',
            github.event.comment.body,
            github.event.issue.body,
            github.event.review.body),
            '/opus')
            && '--model claude-opus-5-5'
            || '--model claude-sonnet-5-5' }}
            --allowedTools "Bash(node:*),Bash(git:*),Bash(gh:*),Bash(unzip:*),Bash(mkdir:*),Bash(grep:*),Bash(diff:*),Bash(ls:*)"

          # 允许 Claude 读取 GitHub Actions CI 结果
          additional_permissions: |
            actions: read

        env:
          ANTHROPIC_BASE_URL: https://aihubmix.com
          SAMPLE_REPO_TOKEN: ${{ secrets.SAMPLE_REPO_TOKEN }}
